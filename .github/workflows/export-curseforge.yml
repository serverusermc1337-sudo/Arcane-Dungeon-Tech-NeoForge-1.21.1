name: Export CurseForge Pack

on:
  workflow_dispatch:
    inputs:
      pack_version:
        description: "Pack version override (optional, defaults to pack.toml version)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify packwiz
        run: packwiz --help

      - name: Refresh index
        run: packwiz refresh

      - name: Export CurseForge pack
        run: |
          packwiz curseforge export -o "ArcaneDungeonTech-curseforge.zip"
          ls -lh ArcaneDungeonTech-curseforge.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-pack
          path: ArcaneDungeonTech-curseforge.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ArcaneDungeonTech-curseforge.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
